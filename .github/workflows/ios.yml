# Builds an UNSIGNED Shelf.ipa on a macOS runner. Sign + install it from Windows
# with Sideloadly (or AltStore/SideStore) using a free Apple ID. See README.
name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'release = bundled app (works offline) · live = loads your laptop dev server'
        type: choice
        options: [release, live]
        default: release
      live_url:
        description: 'Only for live: your laptop dev server, e.g. http://192.168.1.23:5173'
        type: string
        required: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      MODE: ${{ github.event.inputs.mode || 'release' }}
      VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}
      VITE_OMDB_KEY: ${{ secrets.VITE_OMDB_KEY }}
      VITE_TMDB_BASE: ${{ secrets.VITE_TMDB_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check inputs
        if: env.MODE == 'live'
        env:
          LIVE_URL: ${{ github.event.inputs.live_url }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "::error::live mode needs live_url (your laptop's http://<ip>:5173)"; exit 1
          fi

      - run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor (release)
        if: env.MODE == 'release'
        run: npx cap sync ios

      - name: Sync Capacitor (live reload → laptop)
        if: env.MODE == 'live'
        env:
          CAP_LIVE: '1'
          CAP_LIVE_URL: ${{ github.event.inputs.live_url }}
        run: |
          npx cap sync ios
          # allow plain http to the laptop on the local network (dev build only)
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Shelf dev build loads its code from your computer on this Wi-Fi.'" "$PLIST" || true
          cat ios/App/App/capacitor.config.json

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          if [ -f ios/App/Podfile ]; then
            (cd ios/App && pod install)
            TARGET=(-workspace ios/App/App.xcworkspace)
          else
            TARGET=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild archive \
            "${TARGET[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shelf.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/Shelf.xcarchive/Products/Applications/App.app"

      - name: Package Shelf.ipa
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R Shelf.xcarchive/Products/Applications/App.app Payload/
          zip -qry Shelf.ipa Payload
          ls -lh Shelf.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Shelf-${{ env.MODE }}-${{ github.run_number }}
          path: ${{ runner.temp }}/Shelf.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
