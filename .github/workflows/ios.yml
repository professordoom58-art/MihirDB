# Builds an UNSIGNED Shelf.ipa on a macOS runner and publishes it to GitHub Releases.
# Sign + install it from Windows with Sideloadly (or AltStore/SideStore) using a free
# Apple ID. See README.
#   - tag push (v1.2.3)  -> normal release "Shelf v1.2.3", marked latest
#   - manual release run -> pre-release "build-<run>"
#   - manual live run    -> pre-release "live-<run>"
name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'release = bundled app (works offline) · live = loads your laptop dev server'
        type: choice
        options: [release, live]
        default: release
      live_url:
        description: 'Only for live: your laptop dev server, e.g. http://192.168.1.23:5173'
        type: string
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the IPA

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      MODE: ${{ github.event.inputs.mode || 'release' }}
      # Optional overrides. The app already contains a built-in TMDB key
      # (src/lib/config.ts); a repo secret set here takes precedence.
      VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      VITE_OMDB_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check inputs
        if: env.MODE == 'live'
        env:
          LIVE_URL: ${{ github.event.inputs.live_url }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "::error::live mode needs live_url (your laptop's http://<ip>:5173)"; exit 1
          fi

      - run: npm ci

      # No key check needed: the TMDB key is compiled in (src/lib/config.ts).
      # A repo secret, if present, overrides it with VITE_TMDB_API_KEY above.

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor (release)
        if: env.MODE == 'release'
        run: npx cap sync ios

      - name: Sync Capacitor (live reload → laptop)
        if: env.MODE == 'live'
        env:
          CAP_LIVE: '1'
          CAP_LIVE_URL: ${{ github.event.inputs.live_url }}
        run: |
          npx cap sync ios
          # allow plain http to the laptop on the local network (dev build only)
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Shelf dev build loads its code from your computer on this Wi-Fi.'" "$PLIST" || true
          cat ios/App/App/capacitor.config.json

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          if [ -f ios/App/Podfile ]; then
            (cd ios/App && pod install)
            TARGET=(-workspace ios/App/App.xcworkspace)
          else
            TARGET=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild archive \
            "${TARGET[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shelf.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/Shelf.xcarchive/Products/Applications/App.app"

      - name: Package Shelf.ipa
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R Shelf.xcarchive/Products/Applications/App.app Payload/
          zip -qry Shelf.ipa Payload
          ls -lh Shelf.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Shelf-${{ env.MODE }}-${{ github.run_number }}
          path: ${{ runner.temp }}/Shelf.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Release details
        id: rel
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
          LIVE_URL: ${{ github.event.inputs.live_url }}
        run: |
          # Tag push -> versioned release. Manual runs -> a per-run pre-release, so the
          # "latest" release always stays the versioned one.
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            name="Shelf $REF_NAME"
            prerelease=false
            body=""
          elif [ "$MODE" = "live" ]; then
            tag="live-$RUN"
            name="Shelf live build $RUN"
            prerelease=true
            body="**Live build.** Loads the app from \`$LIVE_URL\`. Only works while that dev server is running on the same Wi-Fi."
          else
            tag="build-$RUN"
            name="Shelf build $RUN"
            prerelease=true
            body="**Release build** (bundled, works offline) from manual run #$RUN."
          fi
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "prerelease=$prerelease"
            echo "body<<__EOF__"
            echo "$body"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.name }}
          body: ${{ steps.rel.outputs.body }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          files: ${{ runner.temp }}/Shelf.ipa
          fail_on_unmatched_files: true

      - name: Release summary
        run: |
          echo "### Shelf IPA" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`Shelf.ipa\` in [${{ steps.rel.outputs.name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.rel.outputs.tag }})." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
